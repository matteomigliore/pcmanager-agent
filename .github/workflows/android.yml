name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Chiave di firma stabile: senza, ogni runner ne genererebbe una diversa e Android
      # rifiuterebbe gli aggiornamenti ("signatures do not match"), obbligando a disinstallare
      # e ricollegare l'app su ogni telefono.
      - name: Ripristina chiave di firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::manca il secret ANDROID_KEYSTORE_B64"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/pcmanager.jks"

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/pcmanager.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verifica firma
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/34.0.0/apksigner)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256 digest" | head -1

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PCAgentSetup.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCAgentSetup-apk
          path: PCAgentSetup.apk

      - name: Publish to release (android-latest, non marcata "Latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest PCAgentSetup.apk --clobber
          else
            gh release create android-latest PCAgentSetup.apk \
              --title "PC Manager — App Android" \
              --notes "APK debug installabile via sideload. Vedi android/README.md per l'installazione." \
              --latest=false
          fi
